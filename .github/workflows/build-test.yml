name: WST Go build and test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27'

    - name: Integration tests
      run: go test -v -tags integration ./integration/...

  integration-kubernetes:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27'

    - name: Create kind cluster
      uses: helm/kind-action@v1

    - name: Kubernetes integration tests
      env:
        WST_INTEGRATION_KUBERNETES: "1"
        WST_INTEGRATION_IMAGE_LOADER: kind
      run: go test -v -tags integration -run TestKubernetesInstances ./integration/...
